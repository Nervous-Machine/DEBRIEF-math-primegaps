    dated: "2026-11-07"
    after_checks: true
    verdicts_unchanged: true
    changes:
      - "Cycle 2 evidence line overstated Axiom Math. Its 2026-09-03 announcement said its own prover had checked the deduction and that the Lean formalization would be released with the paper. No public formalization of the 212 bound was found by 2026-11-07. The ledger now says: announced, formalization promised, not public."
      - "Provenance pinned. The tuple and the two axiom statements that C1-C3 transcribe are from openai/PrimeGaps186, commit 61340d0b74163003b32756bb16e91d9209a5e330 (2026-09-02), file Challenge.lean, sha256 b99a403b1946547ef1926cd43ebce717640f7f76fa7e1f8f5a4b19ac2e53e1f0. A verbatim copy is in primegaps/source/ (Apache-2.0). checks.py reads the tuple from that copy and checks the hash; it fails if either differs from what was registered."
      - "C3 as run skips p = 2, where the sum is empty and the bound holds trivially. The rule said primes p <= 61. The omission does not change the result."
      - "Gap G2 gains a source: the repository's formalization.yaml records review status 'self-assessed' and 'No independent human semantic review'."
