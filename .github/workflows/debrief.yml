name: DEBRIEF
on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: Nervous-Machine/DEBRIEF/.github/workflows/validate.yml@main
    with:
      ledger: ledger/primegaps.json
  issue-to-cycle:
    if: github.event_name == 'issues'
    uses: Nervous-Machine/DEBRIEF/.github/workflows/issue-to-cycle.yml@main
    with:
      ledger: ledger/primegaps.json
    permissions:
      contents: write
      pull-requests: write
      issues: write
  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: Nervous-Machine/DEBRIEF/.github/workflows/watch.yml@main
    with:
      ledger: ledger/primegaps.json
    permissions:
      contents: write
      pull-requests: write
  review:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: Nervous-Machine/DEBRIEF/.github/workflows/review.yml@main
    with:
      ledger: ledger/primegaps.json
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
